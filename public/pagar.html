<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento de teste – R$ 1,00</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { font-family:system-ui, sans-serif; background:#f6f9fc; display:flex; justify-content:center; padding:40px 16px; }
    .card { background:#fff; width:100%; max-width:420px; padding:28px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size:1.2rem; margin:0 0 4px; }
    p.sub { color:#555; margin:0 0 20px; }
    button { width:100%; margin-top:20px; padding:12px; border:0; border-radius:8px; background:#635bff; color:#fff; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    #mensagem { margin-top:16px; padding:10px; border-radius:8px; display:none; font-size:.95rem; }
    .ok { background:#e6f7ec; color:#1a7f37; display:block !important; }
    .erro { background:#fdeaea; color:#b42318; display:block !important; }
    a.voltar { display:block; text-align:center; margin-top:16px; color:#635bff; text-decoration:none; font-size:.95rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pagamento de teste</h1>
    <p class="sub">Valor: <strong>R$ 1,00</strong></p>
    <div id="payment-element"></div>
    <button id="pagar">Pagar</button>
    <div id="mensagem"></div>
    <a class="voltar" href="index.html">← Voltar</a>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
