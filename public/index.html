<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bem-vindo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family: system-ui, sans-serif; background:#f6f9fc; color:#222; }
    .tela { width:100%; max-width:520px; padding:24px 16px; text-align:center; }
    .tela img { width:100%; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.15); }
    h1 { margin:24px 0 20px; font-size:1.5rem; }
    a.botao { display:inline-block; width:100%; padding:14px 28px; background:#635bff; color:#fff; border-radius:8px; text-decoration:none; font-size:1.1rem; }
    a.botao:hover { background:#4f46e5; }
  </style>
</head>
<body>
  <div class="tela">
    <img src="capa.jpg" alt="Imagem de capa" />
    <h1>Pagamento de teste</h1>
    <a class="botao" href="pagar.html">Ir para o pagamento</a>
  </div>
</body>
</html>
